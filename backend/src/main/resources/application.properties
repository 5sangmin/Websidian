spring.application.name=backend

# 서버 포트 (env 없으면 8080 기본)
server.port=${BACKEND_PORT:8080}

# --- DataSource: PostgreSQL ---
# 기본값을 Compose 서비스명(postgres) + DB명(websidian)으로 통일
# 로컬 IDE 개발 시에는 DB_URL=jdbc:postgresql://localhost:5432/websidian 설정 필요
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/websidian-pgsql}
spring.datasource.username=${DB_USERNAME:websidian_pgsql}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA/Hibernate 기본 설정 ---
# Flyway가 스키마 관리를 담당하므로 ddl-auto는 validate로 설정
# validate: Flyway migration과 JPA 엔티티 간 스키마 일치 검증만 수행
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway Migration ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Actuator / Health ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.server.port=${MANAGEMENT_PORT:${server.port}}