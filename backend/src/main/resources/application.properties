spring.application.name=backend

# 서버 포트 (env 없으면 8080 기본)
server.port=${BACKEND_PORT:8080}

# --- DataSource: PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/websidian-pgsql}
spring.datasource.username=${DB_USERNAME:websidian_pgsql}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA/Hibernate 기본 설정 ---
# 초기 개발 단계에서는 update로 빠르게 시작하고, 이후 Flyway로 전환 권장
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Actuator / Health ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.server.port=${MANAGEMENT_PORT:${server.port}}